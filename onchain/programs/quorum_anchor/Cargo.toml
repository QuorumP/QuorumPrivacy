[package]
name = "quorum_anchor"
version = "0.1.0"
description = "QUORUM on-chain anchor: eligibility/ballot/result roots per vote"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "quorum_anchor"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "=1.1.2"
solana-bn254 = "=3.2.1"
