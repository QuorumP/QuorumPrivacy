# CI for QUORUM — runs on every push and PR in both the private and the public repo.
# Hardening: every action pinned to a full commit SHA, read-only token, no credentials persisted,
# frozen installs with dependency install scripts off.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bunx tsc --noEmit
      - run: bunx vitest run --coverage   # thresholds in vitest.config.ts fail the job
      - run: bunx vite build

  # Mutation sample: re-plants known-dangerous bugs (unstake TOCTOU, nullifier aliasing, missing
  # authz, unpinned tally key, unchecked verifier inputs…) and fails if any goes undetected.
  mutants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: rustup toolchain install
        working-directory: onchain
      - run: node scripts/test/mutants.mjs
      - run: git diff --exit-code   # every planted mutant was restored

  program:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: onchain
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install   # the version pinned in onchain/rust-toolchain.toml
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets
      - run: cargo install cargo-audit --locked --version 0.22.1 && cargo audit

  # Build of record: solana-verify's Docker build (pinned image), so anyone can reproduce the hash.
  # Fails unless that hash equals onchain/BUILD_HASH (the deployed build) and what is live on devnet:
  # "live code = this commit's code". After a program change it stays red until the artifact below
  # is deployed (scripts/onchain/deploy.mjs) and BUILD_HASH is updated.
  verifiable-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo install solana-verify --locked --version 0.5.2
      - run: solana-verify build --library-name quorum_anchor --base-image solanafoundation/solana-verifiable-build:4.1.0@sha256:6468b89ae21d87b8eb002f894ac3f3442dbd8bcf5ea93414051e96e00d03b5ab
        working-directory: onchain
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quorum_anchor-verifiable
          path: onchain/target/deploy/quorum_anchor.so
      - shell: bash
        run: |
          built=$(solana-verify get-executable-hash onchain/target/deploy/quorum_anchor.so | tail -1)
          live=$(solana-verify get-program-hash -u https://api.devnet.solana.com BHdjYZbXw6ay5qpGcrG3fGb4bmoAnZNKv3fKZ9Gxff6w | tail -1)
          want=$(tr -d '[:space:]' < onchain/BUILD_HASH)
          echo "built:  $built"; echo "live:   $live"; echo "record: $want"
          [ "$built" = "$want" ] || { echo "::error::verifiable build differs from onchain/BUILD_HASH"; exit 1; }
          [ "$live" = "$want" ] || { echo "::error::live devnet program differs from onchain/BUILD_HASH"; exit 1; }
      # Read-only checks of the live deployment: hash (computed independently of solana-verify),
      # upgrade + mint authorities, vault/treasury ownership, leftover buffers.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: node scripts/onchain/post-deploy-check.mjs

  # Sec3 X-ray static analysis (owner/signer checks, type confusion, PDA, arbitrary CPI).
  # It can exit 0 even with findings, so the job fails unless the first line after the summary
  # header is exactly "No issues detected" (shell: bash adds pipefail, so a docker failure fails too).
  xray:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - shell: bash
        run: |
          docker run --rm -v "$PWD:/workspace" ghcr.io/sec3-product/x-ray@sha256:543dc6a984d4abf8792d00884b9225b2ad28cdd06320d7a8ba3855a46a491997 /workspace/onchain/programs/quorum_anchor | tee xray.log   # v0.0.6
          awk '/summary of potential vulnerabilities/ { s = 1; next }
               s && NF { gsub(/^[ \t]+|[ \t]+$/, ""); ok = ($0 == "No issues detected"); s = 0; n++ }
               END { exit !(n == 1 && ok) }' xray.log

  circuits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile --ignore-scripts   # circomlib includes
      - run: cargo install circomspect --locked --version 0.9.0
      - run: circomspect -L node_modules circuits/

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # gitleaks scans the whole history
          persist-credentials: false
      - name: gitleaks (secrets in history)
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git -v --redact .
      - name: semgrep (TypeScript, JavaScript, secrets)
        run: pipx run semgrep==1.178.0 scan --config p/typescript --config p/javascript --config p/secrets --metrics=off --error
