# Long-run stake-vault invariants: 3 seeds × 35k random stake/unstake operations (≈105k calls,
# ~6 min). Too slow for every push; PR CI runs the same suite at 150 ops per seed.
name: nightly
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: read

jobs:
  stake-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bunx vitest run src/fn/stake.test.ts -t invariants
        env:
          STAKE_OPS: "35000"
