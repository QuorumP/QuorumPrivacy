# Hourly read-only ops monitor (scripts/onchain/monitor.mjs): program hash, upgrade + mint
# authorities, authority SOL, large vault outflows, any treasury outflow. A failed run makes GitHub
# notify the repo owner; set the ALERT_WEBHOOK_URL secret to also post alerts to a chat webhook.
# Runbook: SECURITY.md "Incident response".
name: monitor
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: node scripts/onchain/monitor.mjs
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
